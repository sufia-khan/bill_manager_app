<!DOCTYPE html>
<html>
<head>
    <title>App Icon Options - BillMinder</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: white;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .icon-preview {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .icon-preview img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .option-number {
            font-size: 1.5em;
            font-weight: bold;
            color: #F97316;
            margin-bottom: 10px;
        }
        .description {
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>🔔 App Icon Options</h1>
    <p class="subtitle">Pick your favorite! Tell me the option number you like.</p>
    
    <div class="grid">
        <div class="card">
            <div class="option-number">Option 1</div>
            <div class="icon-preview">
                <img src="file:///C:/Users/vasee/.gemini/antigravity/brain/dc7641f7-ade2-49bd-9ce0-a4428bb63d80/bell_option_1_1767714944381.png" alt="Option 1">
            </div>
            <p class="description">Minimalist bell with notification dot</p>
        </div>
        
        <div class="card">
            <div class="option-number">Option 2</div>
            <div class="icon-preview">
                <img src="file:///C:/Users/vasee/.gemini/antigravity/brain/dc7641f7-ade2-49bd-9ce0-a4428bb63d80/bell_option_2_1767714986676.png" alt="Option 2">
            </div>
            <p class="description">Sleek gradient bell with 3D effect</p>
        </div>
        
        <div class="card">
            <div class="option-number">Option 3</div>
            <div class="icon-preview">
                <img src="file:///C:/Users/vasee/.gemini/antigravity/brain/dc7641f7-ade2-49bd-9ce0-a4428bb63d80/bell_option_3_1767715015361.png" alt="Option 3">
            </div>
            <p class="description">Bold bell with money symbol</p>
        </div>
        
        <div class="card">
            <div class="option-number">Option 4</div>
            <div class="icon-preview">
                <img src="file:///C:/Users/vasee/.gemini/antigravity/brain/dc7641f7-ade2-49bd-9ce0-a4428bb63d80/bell_option_4_1767714944381.png" alt="Option 4">
            </div>
            <p class="description">Elegant bell with ring effect</p>
        </div>
        
        <div class="card">
            <div class="option-number">Option 5</div>
            <div class="icon-preview">
                <img src="file:///C:/Users/vasee/.gemini/antigravity/brain/dc7641f7-ade2-49bd-9ce0-a4428bb63d80/bell_option_5_1767715067391.png" alt="Option 5">
            </div>
            <p class="description">Premium bell with calendar/receipt</p>
        </div>
    </div>
</body>
</html>
